<!--In this activity, learn about the Switch and how it works.-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Switch in JS</title>
    </head>
    <body>
        <h1 id="switch">Switch in JS</h1>
        <p>This activity demonstrates the use of the switch statement in JavaScript.</p>
        <p id="result"></p>
        <script>
            // Example of using a switch statement
            let day = new Date().getDay(); // Represents Wednesday
            let dayName;

            switch (day) {
                case 1:
                    dayName = "Monday";
                    break;
                case 2:
                    dayName = "Tuesday";
                    break;
                case 3:
                    dayName = "Wednesday";
                    break;
                case 4:
                    dayName = "Thursday";
                    break;
                case 5:
                    dayName = "Friday";
                    break;
                case 6:
                    dayName = "Saturday";
                    break;
                case 0:
                    dayName = "Sunday";
                    break;
                default:
                    dayName = "Invalid day";
            }

            // Display the result
            document.getElementById("result").innerHTML = "The day is: " + dayName;
        </script>
    </body>
</html>
